[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grail-data-automation"
version = "4.0.0"
description = "Federal Register notice discovery and public-comment analysis"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
grail = "src.pipeline:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = [
  "templates/*.html",
  "static/*.css",
]
