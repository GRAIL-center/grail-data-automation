{% extends "base.html" %}
{% block title %}GRAIL · Error {{ status }}{% endblock %}
{% block content %}
<section class="error-page">
  <span>{{ status }}</span>
  <h1>Something did not line up.</h1>
  <p>{{ message }}</p>
  <a class="button primary" href="{{ url_for('dashboard') }}">Return to workflows</a>
</section>
{% endblock %}
