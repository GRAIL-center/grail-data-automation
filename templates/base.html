<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GRAIL Automation Web Interface{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
            color: #171717;
        }

        .navbar {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 14px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar a {
            color: #737373;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #171717;
            background: #f5f5f5;
        }

        .navbar a.active {
            color: #171717;
            background: #f0f0f0;
        }

        .page {
            max-width: 1120px;
            margin: 48px auto;
            padding: 0 24px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 24px;
        }

        h1, h2 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            gap: 24px;
        }

        .two-column {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4d4d4;
            border-radius: 6px;
            font: inherit;
            background: #fff;
        }

        input:focus, textarea:focus {
            outline: 2px solid #171717;
            outline-offset: 1px;
            border-color: #171717;
        }

        .muted {
            color: #737373;
        }

        .notice-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 28px;
        }

        .notice-title {
            margin: 0 0 8px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .notice-heading p {
            max-width: 660px;
            margin: 0;
            line-height: 1.55;
        }

        .notice-layout {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .section-heading {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #ededed;
        }

        .section-title {
            margin: 0 0 6px;
            font-size: 1rem;
            font-weight: 700;
        }

        .section-heading p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 16px;
        }

        .terms-field textarea {
            min-height: 190px;
            resize: vertical;
            line-height: 1.45;
        }

        .run-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .run-title {
            margin: 0 0 6px;
            font-size: 1rem;
            font-weight: 700;
        }

        .run-panel p {
            margin: 0;
            font-size: 0.9rem;
        }

        .run-button {
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            background: #171717;
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .run-button:hover {
            background: #404040;
        }

        .notice-log {
            margin-top: 20px;
        }

        .notice-log pre {
            margin: 0;
            padding: 14px;
            border-radius: 6px;
            background: #171717;
            color: #e5e5e5;
            white-space: pre-wrap;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        @media (max-width: 720px) {
            .notice-heading, .run-panel {
                flex-direction: column;
            }

            .notice-layout, .settings-grid {
                grid-template-columns: 1fr;
            }

            .run-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
        <a href="{{ url_for('notices') }}" class="{% if request.endpoint == 'notices' %}active{% endif %}">Notices</a>
        <a href="{{ url_for('comments') }}" class="{% if request.endpoint == 'comments' %}active{% endif %}">Comments</a>
        <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">Settings</a>
    </nav>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
