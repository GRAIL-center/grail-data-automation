<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GRAIL Automation Web Interface{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #fafafa;
            color: #171717;
        }

        .navbar {
            display: flex;
            gap: 4px;
            align-items: center;
            padding: 14px 24px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
        }

        .navbar a {
            color: #737373;
            text-decoration: none;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .navbar a:hover {
            color: #171717;
            background: #f5f5f5;
        }

        .navbar a.active {
            color: #171717;
            background: #f0f0f0;
        }

        .page {
            max-width: 1120px;
            margin: 48px auto;
            padding: 0 24px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 24px;
        }

        h1, h2 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            gap: 24px;
        }

        .two-column {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d4d4d4;
            border-radius: 6px;
            font: inherit;
            background: #fff;
        }

        input:focus, textarea:focus, select:focus {
            outline: 2px solid #171717;
            outline-offset: 1px;
            border-color: #171717;
        }

        .order-select {
            cursor: pointer;
            color: #171717;
            background-image: linear-gradient(45deg, transparent 50%, #525252 50%), linear-gradient(135deg, #525252 50%, transparent 50%);
            background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
            background-repeat: no-repeat;
            background-size: 5px 5px, 5px 5px;
            appearance: none;
            padding-right: 36px;
        }

        .order-select:hover {
            border-color: #a3a3a3;
        }

        .muted {
            color: #737373;
        }

        .notice-heading {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 24px;
            margin-bottom: 28px;
        }

        .notice-title {
            margin: 0 0 8px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .notice-heading p {
            max-width: 660px;
            margin: 0;
            line-height: 1.55;
        }

        .notice-layout {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }

        .section-heading {
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #ededed;
        }

        .section-title {
            margin: 0 0 6px;
            font-size: 1rem;
            font-weight: 700;
        }

        .section-heading p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 0 16px;
        }

        .terms-field textarea {
            min-height: 190px;
            resize: vertical;
            line-height: 1.45;
        }

        .run-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .run-title {
            margin: 0 0 6px;
            font-size: 1rem;
            font-weight: 700;
        }

        .run-panel p {
            margin: 0;
            font-size: 0.9rem;
        }

        .run-button {
            border: 0;
            border-radius: 6px;
            padding: 10px 14px;
            background: #171717;
            color: #ffffff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .run-button:hover {
            background: #404040;
        }

        .notice-log {
            margin-top: 20px;
        }

        .notice-log pre {
            margin: 0;
            padding: 14px;
            border-radius: 6px;
            background: #171717;
            color: #e5e5e5;
            white-space: pre-wrap;
            overflow-x: auto;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .comment-heading {
            margin-bottom: 28px;
        }

        .comment-title {
            margin: 0 0 8px;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        .comment-heading p:last-child {
            margin: 0;
            line-height: 1.55;
        }

        .comment-form {
            max-width: 680px;
        }

        .comment-actions {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 6px 20px;
            align-items: center;
            margin-top: 20px;
        }

        .comment-actions p {
            margin: 0;
            font-size: 0.9rem;
        }

        .comment-actions .run-title {
            grid-column: 1;
        }

        .comment-actions .muted {
            grid-column: 1;
        }

        .comment-actions .run-button {
            grid-column: 2;
            grid-row: 1 / span 2;
        }

        .comment-log {
            max-width: 920px;
            margin-top: 20px;
        }

        .comment-log pre {
            min-height: 220px;
            max-height: 480px;
            margin: 0;
            padding: 14px;
            border-radius: 6px;
            background: #171717;
            color: #e5e5e5;
            white-space: pre-wrap;
            overflow-y: auto;
            font-size: 0.85rem;
            line-height: 1.5;
        }

        .is-hidden {
            display: none;
        }

        .settings-shell {
            max-width: 920px;
        }

        .config-editor {
            min-height: 560px;
            resize: vertical;
            border-color: #262626;
            border-radius: 8px;
            background: #171717;
            color: #e5e5e5;
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
            font-size: 0.85rem;
            line-height: 1.55;
            tab-size: 2;
        }

        .config-editor:focus {
            outline-color: #a3a3a3;
            border-color: #a3a3a3;
        }

        .settings-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
        }

        .settings-actions p {
            margin: 0;
            font-size: 0.9rem;
        }

        .settings-message {
            margin: 0 0 20px;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .settings-message.success {
            border: 1px solid #86efac;
            background: #f0fdf4;
            color: #166534;
        }

        .settings-message.error {
            border: 1px solid #fecaca;
            background: #fef2f2;
            color: #991b1b;
        }

        @media (max-width: 720px) {
            .notice-heading, .run-panel, .settings-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .comment-actions {
                grid-template-columns: 1fr;
            }

            .comment-actions .run-button {
                grid-column: 1;
                grid-row: auto;
                width: 100%;
                margin-top: 10px;
            }

            .notice-layout, .settings-grid {
                grid-template-columns: 1fr;
            }

            .run-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
        <a href="{{ url_for('notices') }}" class="{% if request.endpoint == 'notices' %}active{% endif %}">Notices</a>
        <a href="{{ url_for('comments') }}" class="{% if request.endpoint == 'comments' %}active{% endif %}">Comments</a>
        <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">Settings</a>
    </nav>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
