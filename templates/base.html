<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GRAIL Automation Web Interface{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .navbar {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 14px 24px;
            background: #1f2937;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }

        .navbar a {
            color: #f9fafb;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .navbar a:hover {
            background: #374151;
        }

        .navbar a.active {
            background: #2563eb;
        }

        .page {
            max-width: 1000px;
            margin: 32px auto;
            padding: 0 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        h1, h2 {
            margin-top: 0;
        }

        .grid {
            display: grid;
            gap: 24px;
        }

        .two-column {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        label {
            font-weight: 600;
        }

        input, textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
            background: #fff;
        }

        .muted {
            color: #6b7280;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a>
        <a href="{{ url_for('notices') }}" class="{% if request.endpoint == 'notices' %}active{% endif %}">Notices</a>
        <a href="{{ url_for('comments') }}" class="{% if request.endpoint == 'comments' %}active{% endif %}">Comments</a>
        <a href="{{ url_for('settings') }}" class="{% if request.endpoint == 'settings' %}active{% endif %}">Settings</a>
    </nav>

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
